name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Testa APK (debug)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            msg=$( (grep -E "^e: |error:|ERROR|What went wrong" -A6 build.log || tail -40 build.log) | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle::$msg"
            exit 1
          }

      - name: Paraksta atslēga (ja ir iestatīta)
        id: ks
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Play veikala AAB un parakstīts APK
        if: steps.ks.outputs.file != ''
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.ks.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon

      - name: APK ar pastāvīgu nosaukumu
        run: cp app/build/outputs/apk/debug/app-debug.apk ostmalas-dinastija.apk

      - name: Publicē lejupielādei (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ostmalas dinastija 1.0.${{ github.run_number }}
          body: "Testa versija. Lejupielādē ostmalas-dinastija.apk un instalē telefonā."
          make_latest: true
          files: ostmalas-dinastija.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ostmalas-dinastija-testa-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.file != ''
        with:
          name: ostmalas-dinastija-play-veikalam
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
