<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120f24">
<title>Ostmalas dinastija</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&family=Pacifico&display=swap">
<style>
/* Layout: pilnekrāna izometriska pilsēta (Miami Nights gars); stikla HUD augšā, peldošas pogas labajā pusē, cilnes apakšā */
:root{
  --bg:#120f24; --glass:rgba(18,16,40,.72); --glass2:rgba(28,24,56,.9); --line:rgba(255,255,255,.13); --fg:#f7f3ff; --muted:#b2acd2;
  --pink:#ff4fa3; --coral:#ff6f61; --teal:#2fe0d0; --gold:#ffc857; --good:#6fe0a0; --bad:#ff5d7a;
  --f-disp:"Sora", "Trebuchet MS", system-ui, sans-serif; --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; --f-logo:"Pacifico", "Brush Script MT", cursive;
  --hudH:110px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
.wrap>*{min-width:0}
html,body{background:var(--bg);color:var(--fg);height:100%;overflow:hidden}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line)}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hudH) + 14px);z-index:14;padding:6px 14px;border-radius:99px;font-family:var(--f-disp);font-weight:600;font-size:13px;pointer-events:none}

.hud{position:fixed;left:0;right:0;top:0;z-index:20;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-card{max-width:820px;margin:0 auto;border-radius:22px;padding:10px 12px;display:grid;gap:8px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.28);border-image:none;position:relative}
.hud-card::after{content:"";position:absolute;inset:-1px;border-radius:22px;padding:1px;background:linear-gradient(90deg,var(--pink),var(--teal));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.6}
.r1{display:flex;align-items:center;gap:10px;min-width:0}
.ava{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.8);text-shadow:0 1px 2px rgba(0,0,0,.45)}
.ava.sm{width:32px;height:32px;font-size:13px}
.who{flex:1;min-width:0}
.who b{display:block;font-family:var(--f-disp);font-weight:700;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pill{font-family:var(--f-disp);font-weight:700;font-size:14px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.clock{color:var(--teal)}.pill.money{color:var(--gold)}
.needs{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}
.nd{min-width:0}.nd b{display:block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.chips{display:flex;gap:6px;font-family:var(--f-disp);font-weight:700;font-size:12.5px}
.chips span{padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08)}
.chips span:first-child{color:var(--gold)}.chips span:last-child{color:#d8b4ff}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;margin-top:3px}
.bar span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),#8ff0c4);transition:width .4s}
.bar.e span{background:linear-gradient(90deg,#ffd36b,#ffb238)}.bar.f span{background:linear-gradient(90deg,#7be08f,#3fc2a0)}.bar.j span{background:linear-gradient(90deg,#ff7ac0,#ff4fa3)}
.bar.love span{background:linear-gradient(90deg,#ff8fb8,#ff4f7f)}
.bar.warn span{filter:saturate(.8) brightness(.95)}.bar.low span{background:linear-gradient(90deg,#e0435f,var(--bad))}
@media (max-width:560px){.pill{font-size:13px;padding:4px 8px}.ava{width:34px;height:34px}.needs{gap:8px}.chips{font-size:11.5px}}

.fab{position:fixed;z-index:15;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:grid;gap:8px;justify-items:end}
.fab .zm{display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.fab .zm button{width:44px;height:42px;border:0;background:none;font-size:20px;font-weight:700;cursor:pointer}
.fab .zm button+button{border-top:1px solid var(--line)}
.fb{border:0;border-radius:99px;padding:11px 16px;font-family:var(--f-disp);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.fb.sleep{background:linear-gradient(135deg,#ff8a5c,#ff4fa3);color:#fff}
.fb.exit{background:linear-gradient(135deg,#2fe0d0,#3f7fd8);color:#05202a}
.fb.map{background:var(--glass2);border:1px solid var(--line)}
.comp{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;color:#ffc0d6;cursor:pointer}
.banners{position:fixed;z-index:14;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--hudH) + 8px);display:grid;gap:6px;pointer-events:none;justify-items:center}
.banner{font-family:var(--f-disp);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:99px;border-color:rgba(255,200,87,.45)}
.banner.red{border-color:rgba(255,93,122,.7)}
.ticker{position:fixed;z-index:14;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 140px);right:120px;display:grid;gap:6px;pointer-events:none}
.ticker div{justify-self:start;max-width:100%;padding:6px 12px;border-radius:12px;font-size:13px;font-weight:600;animation:fade 6s forwards}
.ticker .g{color:var(--good)}.ticker .b{color:var(--bad)}.ticker .y{color:var(--gold)}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.ticker div{animation:none}.bar span{transition:none}.sheet{animation:none!important}}

nav.tabs{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:560px;margin:0 auto;border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.32)}
nav.tabs button{border:0;background:none;border-radius:17px;padding:10px 2px;font-family:var(--f-disp);font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button[aria-selected="true"]{background:linear-gradient(135deg,rgba(255,79,163,.25),rgba(47,224,208,.18));color:#fff}
.dot{position:absolute;top:6px;right:18%;width:8px;height:8px;border-radius:50%;background:var(--pink)}

.page{position:fixed;inset:0;z-index:12;overflow:auto;background:rgba(14,12,30,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding-top:calc(var(--hudH) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
.page[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
h2{font-family:var(--f-disp);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lab{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}.small{font-size:12.5px}
.panel{background:var(--glass2);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px;min-width:0}
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px}
.row .nm{flex:1 1 150px;min-width:0}.row .nm b{display:block}.row .nm span{font-size:12.5px;color:var(--muted)}.row p{margin:4px 0 0;font-size:14px}
.mini2{display:grid;gap:3px;max-width:160px}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:11px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}.btn:disabled{opacity:.4;cursor:not-allowed}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.kv div{min-width:0}.kv b{display:block;font-size:15.5px}.kv span{display:block}
.statbars{display:grid;gap:9px}
.sb{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}.sb .bar{height:8px;margin:0}
.pbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.pbar .track{height:12px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}.pbar .track span{display:block;height:100%;border-radius:6px}
@media (max-width:560px){.pbar{grid-template-columns:100px 1fr 44px}.sb{grid-template-columns:96px 1fr 32px}}
.gen .n{font-family:var(--f-disp);font-weight:800;font-size:22px;color:var(--gold);min-width:28px}
.log{display:grid;gap:6px;max-height:320px;overflow:auto}
.log div{font-size:13.5px;display:grid;grid-template-columns:52px 1fr;gap:8px}
.log time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .g{color:var(--good)}.log .b{color:var(--bad)}.log .y{color:var(--gold)}

/* telefons */
.phone{min-width:0;max-width:460px;width:100%;margin:0 auto;background:linear-gradient(180deg,#221c48,#16122e);border:1px solid var(--line);border-radius:34px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 0 0 6px rgba(0,0,0,.25)}
.ptop{display:flex;justify-content:space-between;font-family:var(--f-disp);font-size:13px;padding:2px 12px 10px;color:var(--muted)}.ptop b{color:var(--fg)}
.ptabs{min-width:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.ptabs button{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.ptabs button[aria-pressed="true"]{background:linear-gradient(135deg,var(--pink),#b04fff);border-color:transparent;color:#fff}
.pbody{display:grid;gap:10px}
.mapc{width:100%;aspect-ratio:1;border-radius:18px;display:block;cursor:pointer;background:#47b5d8}
.tro{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tr{padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);opacity:.55}.tr.got{opacity:1;border-color:rgba(255,200,87,.55);background:rgba(255,200,87,.08)}
.tr b{display:block;font-size:13.5px}.tr span{font-size:12px;color:var(--muted)}

/* logi */
.ov{position:fixed;inset:0;z-index:50;background:rgba(6,5,16,.35);display:grid;place-items:end center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.ov{place-items:center}}
.sheet{width:min(520px,100%);max-height:82vh;overflow:auto;background:rgba(24,20,50,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:18px;display:grid;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet .head{display:grid;gap:2px}.sheet h2{font-size:22px}.sheet .body p{margin:0 0 8px}
.ch{display:grid;gap:7px}
.chh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink);margin-top:6px}
.ch button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:15px;padding:11px 14px;cursor:pointer;display:grid;gap:1px;transition:border-color .15s,background .15s}
.ch button:hover:not(:disabled){border-color:rgba(255,79,163,.7);background:rgba(255,79,163,.08)}
.ch button:disabled{opacity:.45;cursor:not-allowed}
.ch button b{font-weight:800;font-size:15px}.ch button span{font-size:12.5px;color:var(--muted)}.ch button .why{color:var(--bad)}
.ch button.exit{background:none}.ch button.exit b{color:var(--muted)}
.ch button.go{background:linear-gradient(135deg,#ff8a5c,#ff4fa3);border:0}.ch button.go b,.ch button.go span{color:#fff}
.relrow{display:grid;grid-template-columns:86px 1fr 30px;gap:10px;align-items:center;font-size:13px;font-weight:700;margin-bottom:6px}.relrow .bar{height:8px;margin:0}
input[type=text]{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--fg);font:inherit;font-size:16px}
.seg{display:flex;gap:8px}.seg.wrap{flex-wrap:wrap;margin-top:6px}
.seg button{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;font-weight:700}
.seg.wrap button{flex:0 0 auto;padding:6px 10px;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--pink);color:#ffb0d6;background:rgba(255,79,163,.12)}
.sw{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer}
.sw button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--pink)}
.origin{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.origin div{flex:1;min-width:0}
.logo{font-family:var(--f-logo);font-weight:400;font-size:40px;line-height:1.1;background:linear-gradient(90deg,#ff8a5c,#ff4fa3 50%,#2fe0d0);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.logo em{font-style:normal}
.prev{width:120px;height:120px;justify-self:center;border-radius:50%;background:radial-gradient(circle at 50% 70%,rgba(255,79,163,.35),rgba(47,224,208,.12) 60%,transparent 70%)}
.ov.start{background:radial-gradient(circle at 30% 20%,rgba(255,79,163,.25),transparent 50%),radial-gradient(circle at 80% 80%,rgba(47,224,208,.2),transparent 50%),rgba(10,8,24,.7)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hudH) + 14px);z-index:60;background:rgba(247,243,255,.97);color:#16122e;padding:9px 16px;border-radius:14px;font-weight:800;font-size:14px;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}

/* deja */
#dance{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 30%,#3a1f5c,#0b0818);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px))}
#dance[hidden]{display:none!important}
.dhead{display:flex;justify-content:space-between;font-family:var(--f-disp);font-size:18px;max-width:420px;width:100%;margin:0 auto 10px}
.dhead span{color:var(--teal);font-weight:800}
.dfield{flex:1;max-width:420px;width:100%;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative;overflow:hidden;border-radius:20px;background:rgba(255,255,255,.04)}
.lane{position:relative;border-left:1px solid rgba(255,255,255,.06)}
.note{position:absolute;left:50%;top:-40px;margin-left:-22px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--pink),#9b5bd6);box-shadow:0 0 18px rgba(255,79,163,.6)}
.note.hit{background:var(--good)}.note.miss{background:#555;box-shadow:none}
.hitline{position:absolute;left:0;right:0;top:86%;height:4px;background:linear-gradient(90deg,var(--teal),var(--pink));box-shadow:0 0 14px var(--teal)}
.dbtns{max-width:420px;width:100%;margin:12px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dbtns button{height:64px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:28px;font-weight:900;cursor:pointer;touch-action:manipulation}
.dbtns button.ok{background:var(--good);color:#082}.dbtns button.bad{background:var(--bad)}
</style>
</head>
<body>

<canvas id="world" aria-label="Ostmalas pilsēta. Pieskaries zemei, lai ietu; ēkai, lai ieietu; cilvēkam, lai runātu."></canvas>
<header class="hud" id="hud"></header>
<div class="hint glass" id="hint">Pieskaries, lai ietu</div>
<div class="banners" id="banners"></div>
<div class="ticker" id="ticker"></div>
<button class="comp glass" id="compChip" hidden></button>
<div class="fab" id="fab">
  <div class="zm glass"><button id="zin" aria-label="Pietuvināt">+</button><button id="zout" aria-label="Attālināt">−</button></div>
  <button class="fb map" id="mapBtn">Karte</button>
  <button class="fb exit" id="exitBtn" hidden>Iziet</button>
  <button class="fb sleep" id="sleepBtn">Beigt dienu</button>
</div>
<section class="page" id="tab-phone" hidden><div class="wrap" id="phoneWrap"></div></section>
<section class="page" id="tab-life" hidden><div class="wrap" id="lifeWrap"></div></section>
<section class="page" id="tab-pol" hidden><div class="wrap" id="polWrap"></div></section>
<section class="page" id="tab-dyn" hidden><div class="wrap" id="dynWrap"></div></section>
<nav class="tabs glass" id="tabs" aria-label="Sadaļas" role="tablist">
  <button role="tab" data-tab="city" aria-selected="true">Pilsēta</button>
  <button role="tab" data-tab="phone">Telefons<i class="dot" id="phoneDot" hidden></i></button>
  <button role="tab" data-tab="life">Dzīve</button>
  <button role="tab" data-tab="pol">Politika</button>
  <button role="tab" data-tab="dyn">Dzimta</button>
</nav>
<div id="dance" hidden></div>
<div id="modalRoot"></div>
<script src="data.js"></script>
<script src="world.js"></script>
<script src="state.js"></script>
<script src="render.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script>boot();</script>

</body>
</html>
